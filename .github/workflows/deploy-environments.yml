name: Deploy Environments

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        type: choice
        required: true
        default: test
        options:
          - test
      ref:
        description: "Branch or SHA to deploy"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-target:
    name: Resolve Deployment Target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
    steps:
      - name: Resolve target and ref
        id: resolve
        shell: bash
        run: |
          target="test"
          deploy_ref="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target_environment }}"
            if [[ -n "${{ inputs.ref }}" ]]; then
              deploy_ref="${{ inputs.ref }}"
            fi
          else
            case "${{ github.ref_name }}" in
              test)
                target="test"
                ;;
              *)
                echo "Unsupported branch for deployment: ${{ github.ref_name }}"
                exit 1
                ;;
            esac
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "deploy_ref=$deploy_ref" >> "$GITHUB_OUTPUT"

  build-artifacts:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: resolve-target
    outputs:
      artifact_name: ${{ steps.bundle-meta.outputs.artifact_name }}
      deploy_sha: ${{ steps.bundle-meta.outputs.deploy_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.deploy_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify backend boots
        run: node --check backend/server.js

      - name: Create bundle metadata
        id: bundle-meta
        shell: bash
        run: |
          mkdir -p .deployment-bundle
          deploy_sha="$(git rev-parse HEAD)"
          artifact_name="cardpilot-bundle-${deploy_sha}"
          cat > .deployment-bundle/metadata.json <<EOF
          {
            "sha": "${deploy_sha}",
            "ref": "${{ needs.resolve-target.outputs.deploy_ref }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=${deploy_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle-meta.outputs.artifact_name }}
          path: .deployment-bundle/metadata.json
          if-no-files-found: error
          retention-days: 14

  deploy-test:
    name: Deploy TEST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - resolve-target
      - build-artifacts
    if: needs.resolve-target.outputs.target == 'test'
    environment:
      name: TEST
    env:
      TEST_DEPLOY_WEBHOOK_URL: ${{ secrets.TEST_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.deploy_ref }}

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-artifacts.outputs.artifact_name }}
          path: .deployment-bundle

      - name: Require TEST deployment webhook configuration
        shell: bash
        run: |
          if [[ -z "${TEST_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "TEST_DEPLOY_WEBHOOK_URL is not configured."
            echo "Set TEST_DEPLOY_WEBHOOK_URL before running TEST deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Trigger TEST deployment webhook
        run: |
          curl -sS -X POST "${TEST_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d '{"sha":"${{ needs.build-artifacts.outputs.deploy_sha }}","environment":"test","artifact":"${{ needs.build-artifacts.outputs.artifact_name }}"}'

      - name: Verify TEST deployment API surface
        shell: bash
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL || 'https://cardpilot-qa.onrender.com' }}
        run: |
          attempts=10
          for i in $(seq 1 "$attempts"); do
            health_code=$(curl -s --connect-timeout 5 --max-time 15 -o /dev/null -w "%{http_code}" "${TEST_BASE_URL}/health" || echo 000)
            providers_code=$(curl -s --connect-timeout 5 --max-time 15 -o /dev/null -w "%{http_code}" "${TEST_BASE_URL}/auth/providers" || echo 000)
            pricing_code=$(curl -s --connect-timeout 5 --max-time 15 -o /dev/null -w "%{http_code}" -X POST "${TEST_BASE_URL}/inventory/pricing/estimate-batch" -H "Content-Type: application/json" -d '{"cards":[{"sport":"Football","name":"Probe","team":"Probe","set":"Probe","year":"2026","cardNumber":"1","parallel":"Base"}]}' || echo 000)
            submit_code=$(curl -s --connect-timeout 5 --max-time 15 -o /dev/null -w "%{http_code}" -X POST "${TEST_BASE_URL}/catalog/listing-submit" -H "Content-Type: application/json" -d '{"templateId":"probe","cardRef":"SKU-000001"}' || echo 000)

            echo "Attempt ${i}/${attempts}: health=${health_code} auth/providers=${providers_code} pricing=${pricing_code} listing-submit=${submit_code}"

            if [[ "$health_code" == "200" && "$providers_code" == "200" && "$pricing_code" == "401" && "$submit_code" == "401" ]]; then
              echo "TEST smoke checks passed."
              exit 0
            fi

            if [[ "$i" -lt "$attempts" ]]; then
              sleep 15
            fi
          done

          echo "TEST smoke checks failed: expected health=200, auth/providers=200, pricing=401, listing-submit=401"
          exit 1

      - name: TEST deployment summary
        run: |
          echo "TEST deployment completed for ref: ${{ needs.resolve-target.outputs.deploy_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ${{ needs.build-artifacts.outputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
