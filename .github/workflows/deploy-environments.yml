name: Deploy Environments

on:
  push:
    branches:
      - poc
      - dev
      - qa
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
      ref:
        description: "Branch or SHA to deploy"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve Deployment Target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
    steps:
      - name: Resolve target and ref
        id: resolve
        shell: bash
        run: |
          target=""
          deploy_ref="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target_environment }}"
            if [[ -n "${{ inputs.ref }}" ]]; then
              deploy_ref="${{ inputs.ref }}"
            fi
          else
            case "${{ github.ref_name }}" in
              poc|dev)
                target="dev"
                ;;
              qa)
                target="qa"
                ;;
              *)
                echo "Unsupported branch for deployment: ${{ github.ref_name }}"
                exit 1
                ;;
            esac
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "deploy_ref=$deploy_ref" >> "$GITHUB_OUTPUT"

  build-artifacts:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: resolve-target
    outputs:
      artifact_name: ${{ steps.bundle-meta.outputs.artifact_name }}
      deploy_sha: ${{ steps.bundle-meta.outputs.deploy_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.deploy_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify backend boots
        run: node --check backend/server.js

      - name: Create bundle metadata
        id: bundle-meta
        shell: bash
        run: |
          mkdir -p .deployment-bundle
          deploy_sha="$(git rev-parse HEAD)"
          artifact_name="cardpilot-bundle-${deploy_sha}"
          cat > .deployment-bundle/metadata.json <<EOF
          {
            "sha": "${deploy_sha}",
            "ref": "${{ needs.resolve-target.outputs.deploy_ref }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=${deploy_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle-meta.outputs.artifact_name }}
          path: .deployment-bundle/metadata.json
          if-no-files-found: error
          retention-days: 14

  deploy-dev:
    name: Deploy DEV (POC)
    runs-on: ubuntu-latest
    needs:
      - resolve-target
      - build-artifacts
    if: needs.resolve-target.outputs.target == 'dev'
    environment:
      name: DEV-POC
    env:
      DEV_DEPLOY_WEBHOOK_URL: ${{ secrets.DEV_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.deploy_ref }}

      - name: Require DEV deployment webhook configuration
        shell: bash
        run: |
          if [[ -z "${DEV_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "DEV_DEPLOY_WEBHOOK_URL is not configured."
            echo "Set DEV_DEPLOY_WEBHOOK_URL secret before running DEV deployment promotion." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Trigger DEV deployment webhook
        run: |
          curl -sS -X POST "${DEV_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d '{"sha":"${{ needs.build-artifacts.outputs.deploy_sha }}","environment":"dev"}'

      - name: DEV deployment summary
        run: |
          echo "DEV deployment completed for ref: ${{ needs.resolve-target.outputs.deploy_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ${{ needs.build-artifacts.outputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Configure DEV_DEPLOY_WEBHOOK_URL secret to trigger real infrastructure deployment." >> "$GITHUB_STEP_SUMMARY"

  deploy-qa:
    name: Deploy QA
    runs-on: ubuntu-latest
    needs:
      - resolve-target
      - build-artifacts
    if: needs.resolve-target.outputs.target == 'qa'
    environment:
      name: QA
    env:
      QA_DEPLOY_WEBHOOK_URL: ${{ secrets.QA_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.deploy_ref }}

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-artifacts.outputs.artifact_name }}
          path: .deployment-bundle

      - name: Require QA deployment webhook configuration
        shell: bash
        run: |
          if [[ -z "${QA_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "QA_DEPLOY_WEBHOOK_URL is not configured."
            echo "Set QA_DEPLOY_WEBHOOK_URL secret before running QA deployment promotion." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Trigger QA deployment webhook
        run: |
          curl -sS -X POST "${QA_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d '{"sha":"${{ needs.build-artifacts.outputs.deploy_sha }}","environment":"qa","artifact":"${{ needs.build-artifacts.outputs.artifact_name }}"}'

      - name: Verify QA deployment API surface
        shell: bash
        env:
          QA_BASE_URL: https://cardpilot-qa.onrender.com
        run: |
          check_status() {
            local expected="$1"
            local command="$2"
            local code
            code=$(eval "$command")
            [[ "$code" == "$expected" ]]
          }

          # Allow rollout time for the webhook-triggered deploy to become live.
          attempts=10
          for i in $(seq 1 "$attempts"); do
            health_code=$(curl -s -o /dev/null -w "%{http_code}" "${QA_BASE_URL}/health")
            providers_code=$(curl -s -o /dev/null -w "%{http_code}" "${QA_BASE_URL}/auth/providers")
            pricing_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${QA_BASE_URL}/inventory/pricing/estimate-batch" -H "Content-Type: application/json" -d '{"cards":[{"sport":"Football","name":"Probe","team":"Probe","set":"Probe","year":"2026","cardNumber":"1","parallel":"Base"}]}')
            submit_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${QA_BASE_URL}/catalog/listing-submit" -H "Content-Type: application/json" -d '{"templateId":"probe","cardRef":"SKU-000001"}')

            echo "Attempt ${i}/${attempts}: health=${health_code} auth/providers=${providers_code} pricing=${pricing_code} listing-submit=${submit_code}"

            if [[ "$health_code" == "200" && "$providers_code" == "200" && "$pricing_code" == "401" && "$submit_code" == "401" ]]; then
              echo "QA smoke checks passed."
              exit 0
            fi

            if [[ "$i" -lt "$attempts" ]]; then
              sleep 15
            fi
          done

          echo "QA smoke checks failed: expected health=200, auth/providers=200, pricing=401, listing-submit=401"
          exit 1

      - name: QA deployment summary
        run: |
          echo "QA deployment completed for ref: ${{ needs.resolve-target.outputs.deploy_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ${{ needs.build-artifacts.outputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Configure QA_DEPLOY_WEBHOOK_URL secret to trigger real infrastructure deployment." >> "$GITHUB_STEP_SUMMARY"

