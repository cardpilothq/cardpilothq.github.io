name: Publish Frontend Environments

on:
  push:
    branches:
      - test
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target frontend environment"
        type: choice
        required: true
        default: test
        options:
          - test
          - prod
      ref:
        description: "Branch or SHA to publish"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-frontend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve Frontend Target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
      publish_dir: ${{ steps.resolve.outputs.publish_dir }}
      target_repo: ${{ steps.resolve.outputs.target_repo }}
      app_url: ${{ steps.resolve.outputs.app_url }}
    steps:
      - name: Resolve environment, ref, and destination
        id: resolve
        shell: bash
        env:
          TEST_PAGES_REPO: ${{ vars.TEST_PAGES_REPO }}
          PROD_PAGES_REPO: ${{ vars.PROD_PAGES_REPO }}
          TEST_APP_URL: ${{ vars.TEST_APP_URL }}
          PROD_APP_URL: ${{ vars.PROD_APP_URL }}
        run: |
          target=""
          deploy_ref="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target_environment }}"
            if [[ -n "${{ inputs.ref }}" ]]; then
              deploy_ref="${{ inputs.ref }}"
            fi
          else
            case "${{ github.ref_name }}" in
              test)
                target="test"
                ;;
              main)
                target="prod"
                ;;
              *)
                echo "Unsupported branch for frontend publish: ${{ github.ref_name }}"
                exit 1
                ;;
            esac
          fi

          publish_dir="Frontend"
          target_repo=""
          app_url=""

          case "$target" in
            test)
              target_repo="$TEST_PAGES_REPO"
              app_url="$TEST_APP_URL"
              ;;
            prod)
              target_repo="$PROD_PAGES_REPO"
              app_url="$PROD_APP_URL"
              ;;
            *)
              echo "Unsupported target: $target"
              exit 1
              ;;
          esac

          if [[ -z "$target_repo" ]]; then
            echo "Missing repository variable for target '$target'."
            echo "Set repository variables TEST_PAGES_REPO and PROD_PAGES_REPO."
            exit 1
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "deploy_ref=$deploy_ref" >> "$GITHUB_OUTPUT"
          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"
          echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

  publish-frontend:
    name: Publish Frontend
    runs-on: ubuntu-latest
    needs: resolve-target
    environment:
      name: ${{ needs.resolve-target.outputs.target == 'prod' && 'PROD' || 'TEST' }}
      url: ${{ needs.resolve-target.outputs.app_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.deploy_ref }}

      - name: Validate publish directory
        shell: bash
        run: |
          test -d "${{ needs.resolve-target.outputs.publish_dir }}" || {
            echo "Publish directory not found: ${{ needs.resolve-target.outputs.publish_dir }}"
            exit 1
          }

      - name: Block internal or secret-like files from publish directory
        shell: bash
        run: |
          publish_dir="${{ needs.resolve-target.outputs.publish_dir }}"
          blocked=$(find "$publish_dir" -type f \( \
            -iname "*ops_manual*" -o \
            -iname "*access_registry*" -o \
            -iname "*test-user*" -o \
            -iname "*.env*" -o \
            -iname "*secret*" -o \
            -iname "*password*" -o \
            -path "*/internal/*" \
          \))
          if [[ -n "$blocked" ]]; then
            echo "Blocked files detected in publish directory:"
            echo "$blocked"
            exit 1
          fi

      - name: Add .nojekyll
        shell: bash
        run: touch "${{ needs.resolve-target.outputs.publish_dir }}/.nojekyll"

      - name: Publish to GitHub Pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ needs.resolve-target.outputs.target_repo }}
          publish_branch: main
          publish_dir: ${{ needs.resolve-target.outputs.publish_dir }}
          force_orphan: true
          commit_message: |
            deploy(frontend): ${{ needs.resolve-target.outputs.target }} from ${{ github.repository }}@${{ github.sha }}

      - name: Publish summary
        shell: bash
        run: |
          echo "Frontend target: ${{ needs.resolve-target.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source ref: ${{ needs.resolve-target.outputs.deploy_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish directory: ${{ needs.resolve-target.outputs.publish_dir }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Target repository: ${{ needs.resolve-target.outputs.target_repo }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${{ needs.resolve-target.outputs.app_url }}" ]]; then
            echo "URL: ${{ needs.resolve-target.outputs.app_url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
