name: Promote TEST Artifact to PROD

on:
  workflow_dispatch:
    inputs:
      test_run_id:
        description: "Run ID of successful TEST deployment from Deploy Environments workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-prod-${{ inputs.test_run_id }}
  cancel-in-progress: false

jobs:
  verify-test-run:
    name: Verify TEST Run
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.inspect.outputs.artifact_name }}
      deploy_sha: ${{ steps.inspect.outputs.deploy_sha }}
    steps:
      - name: Validate TEST run and fetch artifact metadata
        id: inspect
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number(core.getInput('test_run_id', { required: true }))
            if (!Number.isFinite(runId) || runId <= 0) {
              core.setFailed('test_run_id must be a positive integer run id')
              return
            }

            const { owner, repo } = context.repo
            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId })
            const wf = run.data

            const validWorkflowNames = new Set(['Deploy Environments', '.github/workflows/deploy-environments.yml'])
            if (!validWorkflowNames.has(wf.name)) {
              core.setFailed(`Run ${runId} is for workflow "${wf.name}", expected one of: ${Array.from(validWorkflowNames).join(', ')}`)
              return
            }
            if (wf.conclusion !== 'success') {
              core.setFailed(`Run ${runId} is not successful (conclusion=${wf.conclusion})`)
              return
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: runId,
              per_page: 100
            })

            const bundle = artifacts.find((a) => a.name && a.name.startsWith('cardpilot-bundle-') && !a.expired)
            if (!bundle) {
              core.setFailed('No valid deployment bundle artifact found for the TEST run')
              return
            }

            const deploySha = String(bundle.name).replace('cardpilot-bundle-', '').trim()
            core.setOutput('artifact_name', bundle.name)
            core.setOutput('deploy_sha', deploySha)

  deploy-prod:
    name: Promote to PROD
    runs-on: ubuntu-latest
    needs: verify-test-run
    environment:
      name: PROD
    env:
      PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Download TEST deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-test-run.outputs.artifact_name }}
          run-id: ${{ inputs.test_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .deployment-bundle

      - name: Show promoted artifact metadata
        shell: bash
        run: |
          echo "Promoting artifact: ${{ needs.verify-test-run.outputs.artifact_name }}"
          echo "Commit SHA: ${{ needs.verify-test-run.outputs.deploy_sha }}"
          cat .deployment-bundle/metadata.json

      - name: Trigger PROD deployment webhook
        shell: bash
        run: |
          if [[ -z "${PROD_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "PROD_DEPLOY_WEBHOOK_URL is not configured. Skipping webhook trigger."
            exit 0
          fi
          curl -sS -X POST "${PROD_DEPLOY_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d '{"sha":"${{ needs.verify-test-run.outputs.deploy_sha }}","environment":"prod","artifact":"${{ needs.verify-test-run.outputs.artifact_name }}","sourceTestRunId":"${{ inputs.test_run_id }}"}'

      - name: PROD promotion summary
        shell: bash
        run: |
          echo "Promoted TEST run id: ${{ inputs.test_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ${{ needs.verify-test-run.outputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: ${{ needs.verify-test-run.outputs.deploy_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Configure PROD_DEPLOY_WEBHOOK_URL secret for real deployment trigger." >> "$GITHUB_STEP_SUMMARY"
